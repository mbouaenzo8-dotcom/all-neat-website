name: Publier la démo Terre 3D
# Publication isolée : seul le build de experiments/earth-hands est exposé.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a10176-all-neat-website
    paths:
      - 'experiments/earth-hands/**'
      - '.github/workflows/publish-earth-hands.yml'

permissions:
  contents: read

concurrency:
  group: earth-hands-pages
  cancel-in-progress: false

jobs:
  build:
    name: Construire la démo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/earth-hands
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiments/earth-hands/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les tests
        run: npm test

      - name: Construire le site statique
        run: npm run build

      - name: Préparer l’artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: experiments/earth-hands/dist

  deploy:
    name: Publier uniquement la démo
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Déployer la démo
        id: deployment
        uses: actions/deploy-pages@v4
